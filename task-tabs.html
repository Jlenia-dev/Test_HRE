<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Task — Test di usabilità</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F3F6F7;
      --ink: #1c1f26;
      --body: #33352f;
      --gold: #c0a05a;
      --muted: #6f6a5e;
      --rule: #ddd8cc;
      --info-bg: #f6fbf9;
      --info-border: #e2efe6;
    }
    * { box-sizing: border-box; }
    html { font-size: 15px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--body);
      font-family: "Jost", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 4.5rem 1.5rem 5rem;
    }
    .sheet { width: 100%; max-width: 620px; }
    .counter { font-size: 0.95rem; color: #9a9488; letter-spacing: 1px; margin: 0 0 1.6rem; }
    h1 {
      font-weight: 400;
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      color: var(--ink);
      letter-spacing: 0.5px;
      margin: 0 0 2.2rem;
    }
    .scenario {
      background: #e7e9e8;
      border-radius: 0.9rem;
      padding: 1.5rem 1.6rem;
      font-size: 1.06rem;
      line-height: 1.65;
      color: #3b3d38;
      margin-bottom: 2.4rem;
    }
    .activity + .activity { border-top: 1px solid var(--rule); margin-top: 1.9rem; padding-top: 1.9rem; }
    .tag {
      display: inline-block;
      background: #e2e4e3;
      color: #6f6a5e;
      font-size: 0.72rem;
      letter-spacing: 2px;
      padding: 0.28rem 0.6rem;
      border-radius: 0.35rem;
      margin-bottom: 0.9rem;
    }
    .activity p,
    .activity ul,
    .activity ol,
    .scenario p,
    .scenario ul,
    .scenario ol {
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.65;
    }
    .activity p + p,
    .activity p + ul,
    .activity p + ol,
    .activity ul + p,
    .activity ol + p,
    .scenario p + p,
    .scenario p + ul,
    .scenario p + ol,
    .scenario ul + p,
    .scenario ol + p {
      margin-top: 0.75rem;
    }
    .activity ul,
    .activity ol,
    .scenario ul,
    .scenario ol {
      padding-left: 1.35rem;
    }
    .activity li + li,
    .scenario li + li {
      margin-top: 0.35rem;
    }
    strong { color: #1c1c1c; font-weight: 600; }
    /* Parole da leggere esattamente come compaiono sul sito:
       si scrivono normali in tasks.js e la pagina le rende maiuscole. */
    .caps { text-transform: uppercase; letter-spacing: 0.04em; }
    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2.8rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: #0b0d10;
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1.4px;
      padding: 1.05rem 1.9rem;
      border-radius: 999px;
      transition: background 0.2s;
    }
    .cta:hover { background: #26292e; }
    .cta:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .hint {
      margin: 1.8rem 0 0;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.5;
      display: flex;
      gap: 0.8rem;
      align-items: flex-start;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      padding: 0.9rem 1rem;
      border-radius: 0.65rem;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .hint svg { flex: 0 0 auto; margin-top: 2px; color: var(--muted); }
    .hint .text { color: var(--muted); margin: 0; }
    .survey-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.72rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.06);
      transition: background 0.12s, color 0.12s;
    }
    .survey-btn:hover { background: rgba(0,0,0,0.04); color: var(--ink); }
    .survey-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .survey-btn svg { opacity: 0.95; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="sheet">
    <p class="counter" id="counter">1/5</p>
    <h1 id="title">Task 1</h1>
    <div id="content"></div>

    <div class="actions">
      <a class="cta" id="startBtn" target="_blank" rel="noopener noreferrer">
        INIZIA IL TASK
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </a>

      <a class="survey-btn" id="surveyBtn" target="_blank" rel="noopener noreferrer" hidden aria-label="Compila questionario">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        Compila questionario
      </a>
    </div>

    <div class="hint" role="note" aria-live="polite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <circle cx="12" cy="16" r="0.5"></circle>
      </svg>
      <p class="text">Il task si aprirà in una nuova scheda del browser; lascia aperta questa scheda per poter tornare e rileggere le istruzioni quando vuoi.</p>
    </div>

  </main>

  <script src="tasks.js"></script>
  <script>
  /* Variante B — l'ambiente non si lascia incorporare.
     Le istruzioni restano in questa scheda, il sito si apre in una
     scheda accanto e il partecipante fa avanti e indietro. */

  const params = new URLSearchParams(location.search);
  const task = TASKS[params.get("task")] || TASKS[1];
  const url = params.get("url") || OVERRIDE_URL || task.url;

  // elementi
  const counterEl = document.getElementById('counter');
  const titleEl = document.getElementById('title');
  const contentEl = document.getElementById('content');
  const startBtn = document.getElementById('startBtn');
  const surveyBtn = document.getElementById('surveyBtn');

  const richTextToHtml = (value = "") => {
    const text = String(value).trim();
    if (!text) return "";

    if (/<\s*(?:ul|ol)\b/i.test(text)) {
      return text;
    }

    return `<p>${text.replace(/\n+/g, "<br>")}</p>`;
  };

  document.title = task.title + " — Test di usabilità";
  counterEl.textContent = task.counter;
  titleEl.textContent = task.title;
  startBtn.href = url;

  /* Il questionario non si apre automaticamente insieme al task: lo lasciamo
     all'azione esplicita dell'utente tramite il pulsante "Compila questionario". */
  const survey = task.survey || (typeof QUESTIONARIO_URL !== "undefined" ? QUESTIONARIO_URL : "");
  if (survey) {
    surveyBtn.href = survey;
    surveyBtn.hidden = false;
  }

  /* activities accetta una stringa o un elenco: con una sola attività
     l'etichetta resta "ATTIVITÀ", con due o più vengono numerate. */
  const activities = [].concat(task.activities || []);

  contentEl.innerHTML =
    `${richTextToHtml(task.scenario)}${activities.map((text, i) => `
      <section class="activity">
        <span class="tag">ATTIVITÀ${activities.length > 1 ? " " + (i + 1) : ""}</span>
        ${richTextToHtml(text)}
      </section>`).join("")}`;
  </script>
</body>
</html>
