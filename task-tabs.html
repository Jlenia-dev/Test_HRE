<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Task — Test di usabilità</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --sheet: #efefee;
      --sheet-deep: #e8e8e6;
      --chip: #dfe0df;
      --ink: #1d1d1d;
      --muted: #5d5a56;
      --rule: #d7d3ce;
      --scenario: #efefef;
      --scenario-border: #d7d5d2;
      --cta: #0c0d10;
      --cta-hover: #1d2024;
      --gold: #c0a05a;
      --info-bg: #f6fbf9;
      --info-border: #e2efe6;
    }
    * { box-sizing: border-box; }
    html { font-size: 15px; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Jost", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }
    .sheet {
      width: 100%;
      max-width: 620px;
      background: var(--sheet);
      border-radius: 2rem;
      padding: 2rem 2rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
    .counter {
      display: inline-block;
      background: var(--chip);
      color: var(--ink);
      font-size: clamp(2rem, 3.5vw, 3rem);
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.04em;
      padding: 0.45rem 1.2rem 0.5rem;
      border-radius: 0.9rem;
      margin: 0 0 0.35rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    }
    h1 {
      font-weight: 600;
      font-size: clamp(2.1rem, 4vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0 0 1.5rem;
    }
    .scenario {
      background: var(--scenario);
      border: 1px solid var(--scenario-border);
      border-radius: 0.8rem;
      padding: 0.9rem 1rem;
      font-size: 1.02rem;
      line-height: 1.6;
      color: #3f3f3d;
      margin-bottom: 1.25rem;
    }
    .activity + .activity {
      border-top: 1px solid var(--rule);
      margin-top: 1.25rem;
      padding-top: 1.25rem;
    }
    .tag {
      display: inline-block;
      background: transparent;
      color: #1e1f1f;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      font-weight: 700;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
    }
    .activity p,
    .activity ul,
    .activity ol,
    .scenario p,
    .scenario ul,
    .scenario ol {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.6;
    }
    .activity p + p,
    .activity p + ul,
    .activity p + ol,
    .activity ul + p,
    .activity ol + p,
    .scenario p + p,
    .scenario p + ul,
    .scenario p + ol,
    .scenario ul + p,
    .scenario ol + p {
      margin-top: 0.55rem;
    }
    .activity ul,
    .activity ol,
    .scenario ul,
    .scenario ol {
      padding-left: 1.2rem;
    }
    .activity li + li,
    .scenario li + li {
      margin-top: 0.25rem;
    }
    strong { color: #1c1c1c; font-weight: 700; }
    .caps { text-transform: uppercase; letter-spacing: 0.04em; }
    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--cta);
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      transition: background 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .cta:hover { background: var(--cta-hover); }
    .cta:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .hint {
      margin: 1.5rem 0 0;
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.45;
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      padding: 0.8rem 0.9rem;
      border-radius: 0.7rem;
    }
    .hint svg { flex: 0 0 auto; margin-top: 2px; color: var(--muted); }
    .hint .text { color: var(--muted); margin: 0; }
    .survey-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.72rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.06);
      transition: background 0.12s, color 0.12s;
    }
    .survey-btn:hover { background: rgba(0,0,0,0.04); color: var(--ink); }
    .survey-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .survey-btn svg { opacity: 0.95; }

    @media (max-width: 520px) {
      .sheet { padding: 1.4rem 1.15rem 1.2rem; border-radius: 1.3rem; }
      .counter { font-size: 1.6rem; }
      h1 { font-size: 2rem; }
      .cta { width: 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="sheet">
    <p class="counter" id="counter">Section 1</p>
    <h1 id="title">Task 1</h1>
    <div id="content"></div>

    <div class="actions">
      <a class="cta" id="startBtn" target="_blank" rel="noopener noreferrer">
        INIZIA IL TASK
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </a>

      <a class="survey-btn" id="surveyBtn" target="_blank" rel="noopener noreferrer" hidden aria-label="Compila questionario">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 7h8M8 12h8M8 17h5"></path></svg>
        Compila questionario
      </a>
    </div>

    <div class="hint" role="note" aria-live="polite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <circle cx="12" cy="16" r="0.5"></circle>
      </svg>
      <p class="text">Il task si aprirà in una nuova scheda del browser; lascia aperta questa scheda per poter tornare e rileggere le istruzioni quando vuoi.</p>
    </div>

  </main>

  <script src="tasks.js"></script>
  <script>
  const params = new URLSearchParams(location.search);
  const task = TASKS[params.get("task")] || TASKS[1];
  const url = params.get("url") || OVERRIDE_URL || task.url;

  const counterEl = document.getElementById('counter');
  const titleEl = document.getElementById('title');
  const contentEl = document.getElementById('content');
  const startBtn = document.getElementById('startBtn');
  const surveyBtn = document.getElementById('surveyBtn');

  const richTextToHtml = (value = "") => {
    const text = String(value).trim();
    if (!text) return "";
    if (/<\s*(?:ul|ol)\b/i.test(text)) return text;
    return `<p>${text.replace(/\n+/g, "<br>")}</p>`;
  };

  const sectionNum = Number((task.counter || "1/5").split('/')[0]) || 1;

  document.title = task.title + " — Test di usabilità";
  counterEl.textContent = `Section ${sectionNum}`;
  titleEl.textContent = task.title;
  startBtn.href = url;

  const survey = task.survey || (typeof QUESTIONARIO_URL !== "undefined" ? QUESTIONARIO_URL : "");
  if (survey) {
    surveyBtn.href = survey;
    surveyBtn.hidden = false;
  }

  const activities = [].concat(task.activities || []);

  contentEl.innerHTML =
    `${richTextToHtml(task.scenario)}${activities.map((text, i) => `
      <section class="activity">
        <span class="tag">ATTIVITÀ${activities.length > 1 ? " " + (i + 1) : ""}</span>
        ${richTextToHtml(text)}
      </section>`).join("")}`;
  </script>
</body>
</html>
